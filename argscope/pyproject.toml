[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "argscope"
version = "0.1.0"
description = "Inspect formal arguments and explain counterexamples"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
argscope = "argscope.__main__:main"

[tool.setuptools.packages.find]
include = ["argscope*"]
