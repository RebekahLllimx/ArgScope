[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "falsifylab"
version = "0.1.0"
description = "Search computational models and confirm candidate counterexamples"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]

[project.scripts]
falsifylab = "falsifylab.__main__:main"

[tool.setuptools.packages.find]
include = ["falsifylab*"]
